<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1 class="header-title">🦷 正畸患者复诊管理</h1>
    <p class="header-subtitle">实时跟踪复诊时间，智能提醒，一目了然</p>
    <div class="header-stats">
      <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">患者总数</div></div>
      <div class="stat-card"><div class="stat-num danger" id="statOverdue">0</div><div class="stat-label">已超期</div></div>
      <div class="stat-card"><div class="stat-num warning" id="statSoon">0</div><div class="stat-label">7天内复诊</div></div>
      <div class="stat-card"><div class="stat-num success" id="statNormal">0</div><div class="stat-label">正常</div></div>
      <div class="stat-card"><div class="stat-num gray" id="statFinished">0</div><div class="stat-label">已结束</div></div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="toolbar-row">
        <div class="tabs">
          <button class="tab active" data-type="fixed" onclick="switchType('fixed')">固定正畸</button>
          <button class="tab" data-type="invisible" onclick="switchType('invisible')">隐形矫正</button>
        </div>
        <div class="search-box">
          <span class="icon">🔍</span>
          <input type="text" id="searchInput" placeholder="搜索患者姓名..." oninput="renderList()">
        </div>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
          <button class="filter-btn" data-filter="overdue" onclick="setFilter('overdue')">已超期</button>
          <button class="filter-btn" data-filter="soon" onclick="setFilter('soon')">7天内</button>
          <button class="filter-btn" data-filter="normal" onclick="setFilter('normal')">正常</button>
          <button class="filter-btn" data-filter="finished" onclick="setFilter('finished')">已结束</button>
        </div>
      </div>
      <div class="tag-filter-bar" id="tagFilterBar">
        <span class="tag-filter-label">🏷️ 标签筛选：</span>
        <span class="tag-chip tag-all active" onclick="setTagFilter('all')" style="background:#E5E7EB;color:#4B5563;">全部</span>
        <!-- Tag chips injected by JS -->
      </div>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-secondary" onclick="showTagManager()">
        <span>🏷️</span> 标签管理
      </button>

    renderTagFilterBar();
    renderList();
  }

  // ========== 标签选择器（编辑弹窗里） ==========
  function renderTagSelector() {
    const sel = document.getElementById('tagSelector');
    sel.innerHTML = TAGS.map(tag => {
      const isSelected = selectedTags.includes(tag.id);
      return `<span class="tag-chip ${isSelected ? 'selected' : ''}" onclick="toggleTagSelect('${tag.id}')" style="background:${tag.color}22;color:${tag.color};">${tag.name}</span>`;
    }).join('');
  }
  function toggleTagSelect(tagId) {
    const idx = selectedTags.indexOf(tagId);
    if (idx >= 0) selectedTags.splice(idx, 1);
    else selectedTags.push(tagId);
    renderTagSelector();
  }

  // ========== 标签管理 ==========
  function showTagManager() {
    renderTagManagerList();
    document.getElementById('newTagName').value = '';
    document.getElementById('newTagColor').value = '#6366F1';
    openModal('tagModal');
  }
  function renderTagManagerList() {
    const list = document.getElementById('tagManagerList');
    if (TAGS.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">暂无标签，请在下方添加</div>';
      return;
    }
    list.innerHTML = TAGS.map((tag, i) => {
      let count = 0;
      ['fixed', 'invisible'].forEach(type => {
        (data[type] || []).forEach(p => {
          if ((p.tags || []).includes(tag.id)) count++;
        });
      });
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gray-soft);border-radius:8px;">
          <input type="color" value="${tag.color}" onchange="updateTagColor(${i}, this.value)" style="width:28px;height:28px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:none;flex-shrink:0;">
          <input type="text" value="${tag.name}" onchange="updateTagName(${i}, this.value)" style="flex:1;padding:6px 10px;border:1px solid transparent;background:white;border-radius:6px;font-size:14px;font-family:inherit;color:var(--text);">
          <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;">${count}人</span>
          <button class="action-btn danger" onclick="deleteTag(${i})" title="删除标签">🗑</button>
        </div>
      `;
    }).join('');
  }
  function addTag() {
    const name = document.getElementById('newTagName').value.trim();
    const color = document.getElementById('newTagColor').value;
    if (!name) { alert('请输入标签名称'); return; }
    const id = 'tag_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    TAGS.push({ id, name, color });
    saveTags();
    renderTagManagerList();
    renderTagFilterBar();
    document.getElementById('newTagName').value = '';
    document.getElementById('newTagName').focus();
  }
  function updateTagName(idx, name) {
    name = name.trim();
    if (!name) { renderTagManagerList(); return; }
    TAGS[idx].name = name;
    saveTags();
    renderTagFilterBar();
  }
  function updateTagColor(idx, color) {
    TAGS[idx].color = color;
    saveTags();
    renderTagFilterBar();
    renderTagManagerList();
  }
  function deleteTag(idx) {
    const tag = TAGS[idx];
    let count = 0;
    ['fixed', 'invisible'].forEach(type => {
      (data[type] || []).forEach(p => {
        if ((p.tags || []).includes(tag.id)) count++;
      });
    });
    const msg = count > 0
      ? `标签「${tag.name}」有 ${count} 个患者在使用，删除后这些患者的该标签将自动解除。确定删除吗？`
      : `确定删除标签「${tag.name}」吗？`;
    if (!confirm(msg)) return;
    ['fixed', 'invisible'].forEach(type => {
      (data[type] || []).forEach(p => {
        const ti = (p.tags || []).indexOf(tag.id);
        if (ti >= 0) p.tags.splice(ti, 1);
      });
    });
    TAGS.splice(idx, 1);
    saveTags();
    saveData();
    renderTagManagerList();
    renderTagFilterBar();
    renderList();
  }

  // ========== 渲染列表 ==========
  function renderList() {
    const list = data[currentType] || [];
    const search = document.getElementById('searchInput').value.trim().toLowerCase();

    let filtered = list.filter(p => {
      if (search && !p.name.toLowerCase().includes(search)) return false;
      const status = getStatus(p);
      if (currentFilter === 'overdue' && status !== 'danger') return false;
      if (currentFilter === 'soon' && status !== 'warning') return false;
      if (currentFilter === 'normal' && status !== 'normal') return false;
      if (currentFilter === 'finished' && status !== 'finished') return false;
      if (currentTagFilter !== 'all' && !(p.tags || []).includes(currentTagFilter)) return false;
      return true;
    });

    const dangerList = [];
    const warningList = [];
    const normalList = [];
    const finishedList = [];

    filtered.forEach(p => {
      const s = getStatus(p);
      if (s === 'danger') dangerList.push(p);
      else if (s === 'warning') warningList.push(p);
      else if (s === 'finished') finishedList.push(p);
      else normalList.push(p);
    });

    const sortByDate = (arr) => arr.sort((a, b) => {
      const da = parseDate(a.nextDate);
      const db = parseDate(b.nextDate);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    });
    sortByDate(dangerList);
    sortByDate(warningList);
    sortByDate(normalList);
    finishedList.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));

    const container = document.getElementById('patientList');

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">没有符合条件的患者</div>
        </div>
      `;
    } else {
      let html = '';

      function renderCard(p) {
        const status = getStatus(p);
        const statusText = status === 'danger' ? '已超期' : (status === 'warning' ? '即将复诊' : (status === 'finished' ? '已结束' : '正常'));
        const dateClass = status === 'danger' ? 'date-danger' : (status === 'warning' ? 'date-warning' : '');
        const realIndex = list.indexOf(p);
        const tags = p.tags || [];
        const displayTags = tags.slice(0, 2);
        const moreCount = tags.length - 2;

        let tagsHtml = '';
        if (tags.length > 0) {
          tagsHtml = '<div class="card-tags">';
          displayTags.forEach(tid => {
            const t = getTagInfo(tid);
            tagsHtml += `<span class="card-tag" style="background:${t.color}22;color:${t.color};">${t.name}</span>`;
          });
          if (moreCount > 0) {
            tagsHtml += `<span class="card-tag more">+${moreCount}</span>`;
          }
          tagsHtml += '</div>';
        }

        return `
          <div class="patient-card status-${status}">
            <div class="patient-name">${p.name}</div>
            <span class="status-badge ${status}">${statusText}</span>
            <span class="date-editor ${dateClass}">
              <input type="date" value="${p.nextDate || ''}" 
                onchange="updateDate(${realIndex}, this.value)"
                onclick="event.stopPropagation()"
                title="点击修改复诊日期">
            </span>
            <span class="days-remaining ${status}">${formatDays(p.nextDate, p.finished)}</span>
            ${tagsHtml}
            <div class="patient-note">${p.note || ''}</div>
            <div class="patient-actions">
              <button class="action-btn" onclick="showHistory(${realIndex})" title="复诊历史">📋</button>
              ${!p.finished ? `<button class="action-btn primary" onclick="showCompleteModal(${realIndex})">完成复诊</button>` : ''}
              <button class="action-btn" onclick="editPatient(${realIndex})">编辑</button>
              <button class="action-btn danger" onclick="deletePatient(${realIndex})">删除</button>
            </div>
          </div>
        `;
      }

      if (dangerList.length > 0) {
        html += `<div class="status-group-title danger"><span class="dot"></span>已超期 <span class="count">${dangerList.length}人</span></div>`;
        html += dangerList.map(renderCard).join('');
      }
      if (warningList.length > 0) {
        html += `<div class="status-group-title warning"><span class="dot"></span>7天内复诊 <span class="count">${warningList.length}人</span></div>`;
        html += warningList.map(renderCard).join('');
      }
      if (normalList.length > 0) {
        html += `<div class="status-group-title normal"><span class="dot"></span>正常 <span class="count">${normalList.length}人</span></div>`;
        html += normalList.map(renderCard).join('');
      }
      if (finishedList.length > 0) {
        html += `<div class="status-group-title finished"><span class="dot"></span>已结束 <span class="count">${finishedList.length}人</span></div>`;
        html += finishedList.map(renderCard).join('');
      }

      container.innerHTML = html;
    }

    updateStats();
  }

  function updateStats() {
    const list = data[currentType] || [];
    let overdue = 0, soon = 0, normal = 0, finished = 0;
    list.forEach(p => {
      const s = getStatus(p);
      if (s === 'danger') overdue++;
      else if (s === 'warning') soon++;
      else if (s === 'finished') finished++;
      else normal++;
    });
    document.getElementById('statTotal').textContent = list.length;
    document.getElementById('statOverdue').textContent = overdue;
    document.getElementById('statSoon').textContent = soon;
    document.getElementById('statNormal').textContent = normal;
    document.getElementById('statFinished').textContent = finished;
  }

  // ========== 操作 ==========
  function switchType(type) {
    currentType = type;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.type === type);
    });
    renderList();
  }
  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === filter);
    });
    renderList();
  }

  // 直接更新日期
  function updateDate(idx, newDate) {
    const p = data[currentType][idx];
    const oldDate = p.nextDate;
    p.nextDate = newDate;
    // 如果是从有日期改到新日期，且是往后推的，记录一条历史？
    // 暂时只更新日期，历史只在"完成复诊"时记录
    renderList();
    scheduleSave();
  }

  // 添加/编辑
  function showAddModal() {
    editingIndex = -1;
    selectedTags = [];
    document.getElementById('modalTitle').textContent = '添加患者';
    document.getElementById('inputName').value = '';
    document.getElementById('inputDate').value = '';
    document.getElementById('inputNote').value = '';
    document.getElementById('finishBtn').style.display = 'none';
    selectCycle(4);
    renderTagSelector();
    openModal('patientModal');
    setTimeout(() => document.getElementById('inputName').focus(), 100);
  }

  function editPatient(idx) {
    const p = data[currentType][idx];
    editingIndex = idx;
    selectedTags = [...(p.tags || [])];
    document.getElementById('modalTitle').textContent = '编辑患者';
    document.getElementById('inputName').value = p.name;
    document.getElementById('inputDate').value = p.nextDate || '';
    document.getElementById('inputNote').value = p.note || '';
    document.getElementById('finishBtn').style.display = p.finished ? 'none' : 'inline-flex';
    document.getElementById('finishBtn').textContent = p.finished ? '' : '结束治疗';
    selectCycle(p.cycleWeeks || 4);
    renderTagSelector();
    openModal('patientModal');
  }

  function selectCycle(weeks) {
    document.querySelectorAll('#cycleSelector .cycle-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.weeks) === weeks);
    });
    window._editCycleWeeks = weeks;
  }

  function toggleFinish() {
    const p = data[currentType][editingIndex];
    if (p.finished) return;
    if (!confirm(`确定将「${p.name}」标记为治疗结束吗？结束后不再参与超期提醒。`)) return;
    p.finished = true;
    closeModal('patientModal');
    renderList();
    saveData();
  }

  function savePatient() {
    const name = document.getElementById('inputName').value.trim();
    const date = document.getElementById('inputDate').value;
    const note = document.getElementById('inputNote').value.trim();
    const cycleWeeks = window._editCycleWeeks || 4;

    if (!name) { alert('请输入患者姓名'); return; }

    const patient = {
      name,
      nextDate: date,
      note,
      cycleWeeks,
      tags: [...selectedTags],
      finished: editingIndex >= 0 ? data[currentType][editingIndex].finished : false,
      history: editingIndex >= 0 ? (data[currentType][editingIndex].history || []) : []
    };

    if (editingIndex >= 0) {
      data[currentType][editingIndex] = patient;
    } else {
      data[currentType].push(patient);
    }

    closeModal('patientModal');
    renderList();
    saveData();
  }

  function deletePatient(idx) {
    const name = data[currentType][idx].name;
    if (!confirm(`确定删除患者「${name}」吗？`)) return;
    data[currentType].splice(idx, 1);
    renderList();
    saveData();
  }

  // 完成复诊
  function showCompleteModal(idx) {
    completePatientIndex = idx;
    const p = data[currentType][idx];
    completeCycleWeeks = p.cycleWeeks || 4;

    // 本次日期默认今天
    document.getElementById('completeVisitDate').value = formatDateStr(today());

    // 周期按钮
    document.querySelectorAll('#completeCycleSelector .cycle-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.weeks) === completeCycleWeeks);
    });

    // 下次日期 = 今天 + 周期
    const nextDate = addWeeks(today(), completeCycleWeeks);
    document.getElementById('completeNextDate').value = nextDate;

    openModal('completeModal');
  }

  function selectCompleteCycle(weeks) {
    completeCycleWeeks = weeks;
    document.querySelectorAll('#completeCycleSelector .cycle-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.weeks) === weeks);
    });
    const visitDate = document.getElementById('completeVisitDate').value;
    if (visitDate) {
      document.getElementById('completeNextDate').value = addWeeks(visitDate, weeks);
    }
  }

  function confirmComplete() {
    const visitDate = document.getElementById('completeVisitDate').value;
    const nextDate = document.getElementById('completeNextDate').value;
    if (!visitDate) { alert('请选择本次复诊日期'); return; }

    const p = data[currentType][completePatientIndex];
    // 记录历史
    if (!p.history) p.history = [];
    p.history.unshift({
      visitDate: visitDate,
      nextDate: nextDate || '',
      cycleWeeks: completeCycleWeeks
    });
    // 更新下次日期和周期
    p.nextDate = nextDate || '';
    p.cycleWeeks = completeCycleWeeks;

    closeModal('completeModal');
    renderList();
    saveData();
  }

  // 当修改本次复诊日期时，自动重算下次
  document.addEventListener('DOMContentLoaded', () => {
    const visitDateInput = document.getElementById('completeVisitDate');
    if (visitDateInput) {
      visitDateInput.addEventListener('change', () => {
        const v = visitDateInput.value;
        if (v) {
          document.getElementById('completeNextDate').value = addWeeks(v, completeCycleWeeks);
        }
      });
    }
  });

  // 历史记录
  function showHistory(idx) {
    const p = data[currentType][idx];
    document.getElementById('historyPatientName').textContent = p.name;
    const history = p.history || [];
    document.getElementById('historyPatientInfo').textContent = `共 ${history.length} 次复诊记录`;

    const list = document.getElementById('historyList');
    if (history.length === 0) {
      list.innerHTML = '<div class="history-empty">暂无复诊记录<br><span style="font-size:12px;">点击「完成复诊」后会自动记录</span></div>';
    } else {
      list.innerHTML = history.map((h, i) => `
        <div class="history-item">
          <div>
            <div class="history-date">第 ${history.length - i} 次 · ${h.visitDate || '未知日期'}</div>
            <div class="history-next">下次复诊：${h.nextDate || '未设置'}${h.cycleWeeks ? `（${h.cycleWeeks}周周期）` : ''}</div>
          </div>
        </div>
      `).join('');
    }
    openModal('historyModal');
  }

  // 导出 Excel
  function exportExcel() {
    const list = data[currentType] || [];
    const typeName = currentType === 'fixed' ? '固定正畸' : '隐形矫正';

    // 处理数据
    const exportData = list.map(p => {
      const status = getStatus(p);
      const statusText = status === 'danger' ? '已超期' : (status === 'warning' ? '即将复诊' : (status === 'finished' ? '已结束' : '正常'));
      const days = daysDiff(p.nextDate);
      let daysText = '';
      if (p.finished) daysText = '已结束';
      else if (days === null) daysText = '未设置';
      else if (days === 0) daysText = '今天';
      else if (days > 0) daysText = `${days}天后`;
      else daysText = `超期${Math.abs(days)}天`;

      const tagNames = (p.tags || []).map(tid => getTagName(tid)).join('、');

      return {
        '姓名': p.name,
        '状态': statusText,
        '下次复诊日期': p.nextDate || '',
        '剩余天数': daysText,
        '复诊周期': p.cycleWeeks ? `${p.cycleWeeks}周` : '',
        '标签': tagNames,
        '复诊次数': (p.history || []).length,
        '备注': p.note || '',
        '是否结束': p.finished ? '是' : '否'
      };
    });

    // 按状态排序导出
    exportData.sort((a, b) => {
      const order = { '已超期': 0, '即将复诊': 1, '正常': 2, '已结束': 3 };
      return (order[a['状态']] || 9) - (order[b['状态']] || 9);
    });

    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, typeName + '患者');

    const now = new Date();
    const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    XLSX.writeFile(wb, `${typeName}患者复诊表_${dateStr}.xlsx`);
  }

  // Modal helpers
  function openModal(id) {
    document.getElementById(id).classList.add('show');
  }
  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }
  document.querySelectorAll('.modal-mask').forEach(mask => {
    mask.addEventListener('click', (e) => {
      if (e.target === mask) mask.classList.remove('show');
    });
  });

  // 初始化
  loadTags();
  loadData();
  renderTagFilterBar();
  renderList();

  // 每分钟刷新
  setInterval(renderList, 60000);
</script>
</body>
</html>
